name: EDWIN CNC 3D - Windows 64 bits

# Arma el instalador de EDWIN CNC 3D (basado en build-windows.yml de IngeTrazo).
# Corre al subir cambios a la rama edwin, con un tag v*, o a mano desde Actions.
on:
  push:
    branches: [edwin]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  INGETRAZO_REQUIRE_RUST: "1"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install PySide6==6.11.2 numpy "ezdxf>=1.4.4" "manifold3d>=3.5.3" "truststore>=0.10.5"
          # Foto → DXF (EDWIN CNC): Apache-2.0, sin interfaz propia (headless) para no chocar con Qt.
          pip install "opencv-python-headless==4.10.0.84"
          # PyInstaller con el arrancador compilado aquí (menos falsos positivos de antivirus).
          pip download --no-binary pyinstaller --no-deps pyinstaller -d "$RUNNER_TEMP/pyi"
          PYI_SRC="$(python -c "import glob, os, sys, tarfile; d = os.path.join(os.environ['RUNNER_TEMP'], 'pyi'); t = tarfile.open(glob.glob(os.path.join(d, 'pyinstaller-*.tar.gz'))[0]); t.extractall(d, filter='data'); print(os.path.join(d, t.getnames()[0].split('/')[0]))")"
          PYI_SRC="$(cygpath -u "$PYI_SRC")"
          rm -f "$PYI_SRC"/PyInstaller/bootloader/Windows-64bit-intel/*.exe
          (cd "$PYI_SRC/bootloader" && python ./waf all --target-arch=64bit)
          test -f "$PYI_SRC/PyInstaller/bootloader/Windows-64bit-intel/run.exe"
          test -f "$PYI_SRC/PyInstaller/bootloader/Windows-64bit-intel/runw.exe"
          pip install "$PYI_SRC"
          pip install "openskp @ git+https://github.com/iamahsanmehmood/openskp@291700bc213655a00461838de71e5f206311e619#subdirectory=packages/python"
          python -c "import openskp, openskp.legacy; print('openskp OK')"

      - name: Pruebas EDWIN (desdoblado, botón, helicoidal, escala y foto)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: |
          python edwin/pruebas/pruebas_desdoblar.py
          python edwin/pruebas/prueba_plugin.py
          python edwin/pruebas/prueba_helicoidal.py
          python edwin/pruebas/prueba_escala.py
          python edwin/pruebas/prueba_foto_dxf.py
          python edwin/pruebas/prueba_foto_ventana.py

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Motor Rust
        shell: bash
        run: |
          pip install maturin
          maturin build --release -m rust/ingetrazo_core/Cargo.toml -o "$RUNNER_TEMP/wheels"
          pip install "$RUNNER_TEMP"/wheels/ingetrazo_core-*.whl
          INGETRAZO_RUST=1 python -c "import core._native as n; assert n.native is not None; print('motor:', n.engine())"

      - name: Conversor DWG (LibreDWG win64)
        shell: bash
        run: |
          set -e
          V=0.14.8597
          SHA=7fee5c67c4f451f0542c0d6a3b12e91e99b15faf363fbf8b98ad84bac17ddfa2
          curl -fsSL -o "$RUNNER_TEMP/ldwg.zip" \
            "https://github.com/LibreDWG/libredwg/releases/download/$V/libredwg-$V-win64.zip"
          echo "$SHA  $RUNNER_TEMP/ldwg.zip" | sha256sum -c -
          mkdir -p vendor/libredwg/bin
          unzip -j -o "$RUNNER_TEMP/ldwg.zip" dwg2dxf.exe libredwg-0.dll libiconv-2.dll \
            -d vendor/libredwg/bin

      - name: Compilar con PyInstaller
        shell: bash
        run: |
          pyinstaller ingetrazo.spec --noconfirm
          du -sh dist/ingetrazo/

      - name: Revisar el paquete
        shell: bash
        run: |
          test -f dist/ingetrazo/ingetrazo.exe
          test -f dist/ingetrazo/_internal/plugins/edwin_cnc.py
          test -d dist/ingetrazo/_internal/cv2   # Foto → DXF
          test -f dist/ingetrazo/_internal/i18n/es.json
          ./dist/ingetrazo/ingetrazo.exe --check
          echo "paquete OK"

      - name: Versión
        id: ver
        shell: bash
        run: |
          VERSION=$(grep '^EDWIN_VERSION' core/version.py | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versión: $VERSION"

      - name: ZIP portable
        shell: pwsh
        run: |
          @"
          EDWIN CNC 3D - version portable (sin instalar)

          1. Descomprima esta carpeta donde quiera (ej. C:\EDWIN-CNC-3D\)
          2. Doble clic en ingetrazo.exe
          3. Si Windows dice "Windows protegio su PC": "Mas informacion" y
             "Ejecutar de todas formas".

          Si falla con "Failed to load python312.dll", instale:
            https://aka.ms/vs/17/release/vc_redist.x64.exe

          Basado en IngeTrazo (GPL-3.0). Codigo: https://github.com/INGEMAQSEWING/edwin-cnc-3d
          "@ | Set-Content dist/ingetrazo/LEEME.txt -Encoding ascii
          Compress-Archive -Path dist/ingetrazo -DestinationPath "dist/EDWIN-CNC-3D-${{ steps.ver.outputs.version }}-portable.zip"

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-Not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" "installer\edwin-cnc-3d.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist

      - name: Subir instalador
        uses: actions/upload-artifact@v4
        with:
          name: edwin-cnc-3d-windows
          path: |
            dist/EDWIN-CNC-3D-*.exe
            dist/EDWIN-CNC-3D-*-portable.zip
          retention-days: 14
